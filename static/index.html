<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callout CAD</title>

  <link rel="stylesheet" href="/leaflet/leaflet.css">
  <script src="/leaflet/leaflet.js"></script>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    /* ---- Login ---- */
    .login-view {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 32px 28px;
      width: 340px;
      max-width: 90vw;
    }
    .login-box h1 {
      font-size: 20px;
      font-weight: 700;
      color: #e94560;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-subtitle {
      text-align: center;
      color: #8888aa;
      margin-bottom: 20px;
    }
    .login-error {
      background: rgba(233, 69, 96, 0.15);
      border: 1px solid #e94560;
      border-radius: 4px;
      padding: 8px 12px;
      color: #e94560;
      margin-bottom: 12px;
    }
    .login-box label {
      display: block;
      color: #8888aa;
      margin-bottom: 10px;
    }
    .login-box input {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #e0e0e0;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
    }
    .login-box input:focus { outline: none; border-color: #e94560; }
    .login-btn { width: 100%; margin-top: 8px; }

    /* ---- App Shell ---- */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #16213e;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
    }
    .app-header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #e94560;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .status-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .user-info { color: #8888aa; font-size: 11px; }
    .header-btn { padding: 3px 10px; font-size: 11px; }

    .status-online { color: #00e676; font-weight: 600; }
    .status-online::before {
      content: ""; display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: #00e676; margin-right: 4px;
    }
    .status-offline { color: #ff5252; font-weight: 600; }
    .status-offline::before {
      content: ""; display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: #ff5252; margin-right: 4px;
    }

    /* ---- Tab Bar ---- */
    .tab-bar {
      display: flex;
      gap: 0;
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
      padding: 0 8px;
      position: relative;
      z-index: 1000;
    }
    .tab-btn {
      padding: 8px 16px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #8888aa;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: #e0e0e0; }
    .tab-btn.active {
      color: #e94560;
      border-bottom-color: #e94560;
    }
    .tab-popout {
      padding: 2px 6px;
      margin-left: 4px;
      background: transparent;
      border: 1px solid #2a2a4a;
      color: #8888aa;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      border-radius: 2px;
    }
    .tab-popout:hover {
      border-color: #e94560;
      color: #e94560;
    }

    /* ---- Tab Content ---- */
    .tab-content {
      flex: 1;
      overflow: hidden;
      display: flex;
    }
    .tab-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
    }
    .tab-panel.active {
      display: flex;
    }

    /* ---- Dispatch Panel (main workspace) ---- */
    .dispatch-panel {
      flex: 1;
      display: flex;
      gap: 0;
    }
    .dispatch-form-area {
      width: 360px;
      flex-shrink: 0;
      border-right: 1px solid #2a2a4a;
      padding: 12px;
      overflow-y: auto;
      background: #16213e;
    }
    .dispatch-form-area h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #e94560;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a4a;
    }
    .event-table-area {
      flex: 1;
      overflow: auto;
      padding: 0;
    }

    /* ---- Event Table ---- */
    .event-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .event-table th {
      position: sticky;
      top: 0;
      background: #16213e;
      color: #8888aa;
      text-align: left;
      padding: 6px 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #2a2a4a;
      white-space: nowrap;
    }
    .event-table td {
      padding: 4px 8px;
      border-bottom: 1px solid #1a1a2e;
      white-space: nowrap;
    }
    .event-table tr:hover td {
      background: rgba(233, 69, 96, 0.08);
    }
    .event-table tr.selected td {
      background: rgba(233, 69, 96, 0.15);
    }
    .priority-1 { color: #ff1744; font-weight: 700; }
    .priority-2 { color: #ff9100; font-weight: 700; }
    .priority-3 { color: #ffea00; }
    .priority-4 { color: #76ff03; }
    .priority-5 { color: #8888aa; }

    /* ---- Sidebar Panels (incidents, units) ---- */
    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-list h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8888aa;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a4a;
    }
    .sidebar-list h2:not(:first-child) { margin-top: 14px; }

    /* ---- Map Panel ---- */
    .map-panel {
      flex: 1;
      display: flex;
    }
    .map-panel .map-container {
      flex: 1;
      min-height: 0;
    }

    /* ---- Incident/Unit Items ---- */
    .incident-item, .unit-item {
      padding: 6px 8px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      font-size: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .incident-item:hover, .unit-item:hover {
      border-color: #3a3a5a;
    }
    .severity { font-weight: 700; min-width: 24px; }
    .incident-id, .unit-id { color: #8888aa; font-size: 11px; }
    .incident-status, .unit-status { font-size: 11px; }
    .incident-desc { color: #b0b0c0; font-size: 11px; flex: 1; }
    .unit-name { font-weight: 600; }

    /* ---- Forms ---- */
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      color: #8888aa;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      display: block;
      width: 100%;
      padding: 6px 8px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #e0e0e0;
      border-radius: 3px;
      font-family: inherit;
      font-size: 13px;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #e94560;
    }
    .form-group textarea { min-height: 60px; resize: vertical; }

    /* ---- Buttons ---- */
    .btn-primary {
      background: #e94560;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      font-size: 12px;
    }
    .btn-primary:hover { background: #c73550; }
    .btn-secondary {
      background: transparent;
      color: #8888aa;
      border: 1px solid #2a2a4a;
      padding: 6px 16px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }
    .btn-secondary:hover { border-color: #8888aa; color: #e0e0e0; }
    .btn-danger {
      background: #c73550;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
    }
    .btn-danger:hover { background: #a02040; }

    /* ---- Dialogs ---- */
    .incident-dialog {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .dialog-content {
      background: #16213e;
      border: 1px solid #e94560;
      border-radius: 4px;
      padding: 20px;
      width: 400px;
      max-width: 90vw;
    }
    .dialog-content h3 { color: #e94560; margin-bottom: 12px; }
    .dialog-content p { color: #8888aa; margin-bottom: 10px; }
    .dialog-content label { display: block; margin-bottom: 10px; }
    .dialog-content select,
    .dialog-content textarea,
    .dialog-content input {
      display: block; width: 100%; margin-top: 4px;
      padding: 6px 8px; background: #1a1a2e;
      border: 1px solid #2a2a4a; color: #e0e0e0;
      border-radius: 3px; font-family: inherit; font-size: 13px;
    }
    .dialog-buttons {
      display: flex; gap: 8px;
      justify-content: flex-end; margin-top: 12px;
    }

    /* ---- Unit Markers ---- */
    .unit-marker {
      background: #0f3460;
      color: #e0e0e0;
      border: 2px solid #00e676;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      line-height: 32px;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ---- Admin Overlay ---- */
    .admin-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #1a1a2e;
      z-index: 8000;
      overflow-y: auto;
    }
    .admin-close-bar {
      display: flex;
      justify-content: flex-end;
      padding: 6px 12px;
      background: #16213e;
      border-bottom: 2px solid #e94560;
      position: sticky;
      top: 0;
      z-index: 8001;
    }
    .admin-panel { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .admin-panel h2 { font-size: 18px; color: #e94560; margin-bottom: 12px; }
    .admin-tabs {
      display: flex; gap: 0;
      border-bottom: 2px solid #2a2a4a;
      margin-bottom: 20px;
    }
    .admin-tab {
      padding: 8px 20px;
      background: transparent; border: none;
      color: #8888aa; cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-family: inherit; font-size: 12px;
    }
    .admin-tab:hover { color: #e0e0e0; }
    .admin-tab.active { color: #e94560; border-bottom-color: #e94560; }
    .admin-tab-content { display: none; }
    .admin-tab-content.active { display: block; }
    .admin-item {
      padding: 8px 10px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .admin-item-name { font-weight: 600; }
    .admin-item-meta { color: #8888aa; font-size: 11px; }
    .admin-item-desc { color: #666688; font-size: 11px; }
    .admin-item-status { font-size: 11px; }
    .admin-item-status.active { color: #00e676; }
    .admin-item-status.inactive { color: #ff5252; }
    .admin-form {
      background: #16213e; border: 1px solid #2a2a4a;
      border-radius: 4px; padding: 16px; margin-bottom: 16px;
    }
    .admin-form h3 { color: #e94560; margin-bottom: 12px; }
    .admin-form label { display: block; color: #8888aa; margin-bottom: 10px; }
    .admin-form input, .admin-form select, .admin-form textarea {
      display: block; width: 100%; margin-top: 4px;
      padding: 6px 10px; background: #1a1a2e;
      border: 1px solid #2a2a4a; color: #e0e0e0;
      border-radius: 3px; font-family: inherit; font-size: 13px;
    }
    .admin-form textarea { min-height: 60px; resize: vertical; }

    /* ---- SOP Panel ---- */
    .sop-panel { padding: 12px; }
    .sop-panel h2 {
      font-size: 13px; text-transform: uppercase;
      letter-spacing: 1px; color: #8888aa;
      margin-bottom: 6px; padding-bottom: 4px;
      border-bottom: 1px solid #2a2a4a;
    }
    .sop-list { display: flex; flex-direction: column; gap: 4px; }
    .sop-item { border: 1px solid #2a2a4a; border-radius: 3px; overflow: hidden; }
    .sop-header {
      padding: 6px 10px; background: #16213e;
      cursor: pointer; display: flex;
      align-items: center; justify-content: space-between;
    }
    .sop-header:hover { background: #1a2040; }
    .sop-title { font-weight: 600; }
    .sop-body { padding: 10px; background: #1a1a2e; border-top: 1px solid #2a2a4a; }
    .sop-content { line-height: 1.5; color: #b0b0c0; white-space: pre-wrap; }
    .sop-links {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid #2a2a4a;
    }
    .sop-link-btn {
      display: inline-block; padding: 3px 10px;
      background: #0f3460; color: #e0e0e0;
      border-radius: 3px; font-size: 11px;
      text-decoration: none; border: 1px solid #2a4a7a;
    }
    .sop-link-btn:hover { background: #1a4a80; border-color: #4a6a9a; }
    .sop-empty { color: #666688; padding: 8px 0; font-style: italic; }

    .close-btn {
      background: none; border: none;
      color: #8888aa; font-size: 20px; cursor: pointer;
      font-family: inherit;
    }
    .close-btn:hover { color: #e94560; }

    /* ---- Mobile ---- */
    @media (max-width: 768px) {
      .dispatch-panel { flex-direction: column; }
      .dispatch-form-area {
        width: 100%; border-right: none;
        border-bottom: 1px solid #2a2a4a;
        max-height: 40vh;
      }
      .tab-btn { padding: 6px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <noscript>
    <p style="padding: 40px; text-align: center;">
      Callout CAD requires JavaScript.
    </p>
  </noscript>
  <script src="/app.bc.js"></script>
</body>
</html>
