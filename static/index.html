<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callout CAD</title>

  <!-- Vendored Leaflet — no CDN dependency -->
  <link rel="stylesheet" href="/leaflet/leaflet.css">
  <script src="/leaflet/leaflet.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #16213e;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
    }

    .app-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #e94560;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 13px;
    }

    .status-online {
      color: #00e676;
      font-weight: 600;
    }

    .status-online::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      margin-right: 6px;
    }

    .status-offline {
      color: #ff5252;
      font-weight: 600;
    }

    .status-offline::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff5252;
      margin-right: 6px;
    }

    .app-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .map-container {
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      width: 320px;
      background: #16213e;
      border-left: 1px solid #2a2a4a;
      overflow-y: auto;
      padding: 12px;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8888aa;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2a2a4a;
    }

    .sidebar h2:not(:first-child) {
      margin-top: 16px;
    }

    .incident-list, .unit-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Incident creation dialog */
    .incident-dialog {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .dialog-content {
      background: #16213e;
      border: 1px solid #e94560;
      border-radius: 8px;
      padding: 24px;
      width: 400px;
      max-width: 90vw;
    }

    .dialog-content h3 {
      color: #e94560;
      margin-bottom: 16px;
    }

    .dialog-content p {
      font-size: 13px;
      color: #8888aa;
      margin-bottom: 12px;
    }

    .dialog-content label {
      display: block;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .dialog-content select,
    .dialog-content textarea {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #e0e0e0;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }

    .dialog-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .btn-primary {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #c73550;
    }

    .btn-secondary {
      background: transparent;
      color: #8888aa;
      border: 1px solid #2a2a4a;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: #8888aa;
      color: #e0e0e0;
    }

    /* Unit markers on map */
    .unit-marker {
      background: #0f3460;
      color: #e0e0e0;
      border: 2px solid #00e676;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 36px;
    }

    /* Incident detail panel */
    .incident-detail {
      position: fixed;
      top: 0;
      right: 0;
      width: 480px;
      height: 100vh;
      background: #16213e;
      border-left: 2px solid #e94560;
      z-index: 5000;
      overflow-y: auto;
    }

    .incident-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #2a2a4a;
    }

    .incident-body {
      padding: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8888aa;
      font-size: 24px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #e94560;
    }
  </style>
</head>
<body>
  <!-- App shell is built by OCaml (js_of_ocaml) -->
  <noscript>
    <p style="padding: 40px; text-align: center;">
      Callout CAD requires JavaScript. Please enable it.
    </p>
  </noscript>

  <!-- Compiled OCaml frontend -->
  <script src="/app.bc.js"></script>
</body>
</html>
